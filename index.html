<style>
:root{--navy:#0D1721;--raised:#132840;--border:#24405F;--ink:#F6FAFD;--soft:#A7C5E1;--red:#E3203E;--blue:#5691DF;--crit:#FF6B81}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font:15px "Fira Sans",Arial,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:16px}
form{width:min(380px,100%);background:var(--raised);border:1px solid var(--border);border-radius:18px;padding:28px 24px;display:grid;gap:14px}
.logo{height:28px;width:auto}
h1{font:400 20px "Russo One",Arial,sans-serif;margin:4px 0 0}
p{margin:0;color:var(--soft);font-size:13.5px}
label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
input[type=password]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--navy);color:var(--ink);font:inherit}
input[type=password]:focus{outline:2px solid var(--blue);outline-offset:1px}
.rec{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--soft)}
button{padding:11px;border:0;border-radius:12px;background:var(--red);color:#fff;font:600 15px "Fira Sans",Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13px;min-height:18px}
</style></head><body>

const LS="2ebox-cc-key-"+D.salt.slice(0,8);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  const txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(txt);document.close();
}
async function derivar(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{let g=null;try{g=localStorage.getItem(LS)}catch(_){}
  if(g){try{await abrir(await crypto.subtle.importKey("raw",b64(g),"AES-GCM",false,["decrypt"]));return}catch(_){try{localStorage.removeItem(LS)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;b.textContent="Abriendo…";e.textContent="";
  try{const key=await derivar(document.getElementById("k").value);
    let raw=null;if(document.getElementById("r").checked)raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
    await abrir(key);
    if(raw){try{localStorage.setItem(LS,btoa(String.fromCharCode(...raw)))}catch(_){}}
  }catch(_){e.textContent="Clave incorrecta.";b.disabled=false;b.textContent="Entrar"}
});
